# Render Blueprint: one web service, everything in one place.
# Frontend, /api/* and the AI chat are all served by this one Flask app via the
# ROOT Dockerfile builds the whole app; Flask exposes /api/* only.
# Database: Aiven's free MySQL (Render has no free MySQL) — paste its
# connection string when Render prompts for DATABASE_URL at deploy time.
services:
  - type: web
    name: customer-rep
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Auto-generated random values
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # You provide these at deploy time (Aiven MySQL URL, Groq key)
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
