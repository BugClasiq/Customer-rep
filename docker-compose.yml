services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-project_db}
      MYSQL_USER: ${DB_USER:-project}
      MYSQL_PASSWORD: ${DB_PASSWORD:-project_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-project_root_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-project}
      DB_PASSWORD: ${DB_PASSWORD:-project_password}
      DB_NAME: ${DB_NAME:-project_db}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_key_change_me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-groq/compound-mini}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health').status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  ai:
    build: ./backend
    restart: unless-stopped
    command: ["python", "ai/main.py"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-project}
      DB_PASSWORD: ${DB_PASSWORD:-project_password}
      DB_NAME: ${DB_NAME:-project_db}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_key_change_me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-groq/compound-mini}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    ports:
      - "7860:7860"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
